image: rocker/r-ver:4.4.3

stages:
  - unit-test

variables:
  R_LIBS_USER: "$CI_PROJECT_DIR/rlib"
  # Pre-built binary packages for Ubuntu 24.04 Noble — no compiler required
  CRAN: "https://packagemanager.posit.co/cran/__linux__/noble/latest"

cache:
  key: "r-4.4.3-$CI_COMMIT_REF_SLUG"
  paths:
    - rlib/

before_script:
  - apt-get update -qq && apt-get install -y --no-install-recommends libglu1-mesa-dev libgl1-mesa-dev
  - mkdir -p "$R_LIBS_USER"
  - Rscript -e ".libPaths('$R_LIBS_USER'); install.packages(c('remotes', 'pkgload', 'testthat', 'mockery'), lib='$R_LIBS_USER', repos='$CRAN', quiet=TRUE)"
  - Rscript -e ".libPaths('$R_LIBS_USER'); remotes::install_deps('.', dependencies=c('Depends','Imports','LinkingTo'), lib='$R_LIBS_USER', repos='$CRAN', quiet=TRUE)"

ausplots-r-unit-tests:
  stage: unit-test
  script:
    - Rscript -e ".libPaths('$R_LIBS_USER'); pkgload::load_all('.'); testthat::test_local('.', stop_on_failure=TRUE)"
  artifacts:
    when: always
    paths:
      - tests/
    expire_in: 1 week